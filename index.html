<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>御剑封路 · Road Defender</title>
<!-- ══ 分享卡片用 ══
     链接丢进微信群/朋友圈时，微信和各家平台的抓取器只读静态 HTML，不跑 JS，
     所以标题取 <title>、摘要取下面的 description、缩略图取 og:image。
     没有这几行，群里显示的就是一条"光秃秃的网址"，点的人会明显变少。

     ⚠️ og:image / og:url **必须是绝对地址**，抓取器不会帮你补上域名。
     换域名（自定义域名、改仓库名、迁到别的托管）时，这三行要跟着一起改。 -->
<meta name="description" content="御剑封路 —— 三路妖物扑击的伪 3D 躲避射击小游戏。按住左右拖动御剑破阵，捡武器换流派，buff 可叠加，撑满 180 秒算通关。">
<meta name="theme-color" content="#0b0d12">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="御剑封路 · Road Defender">
<meta property="og:description" content="三路妖物扑击的伪 3D 躲避射击小游戏。按住左右拖动御剑破阵，撑满 180 秒算通关。">
<meta property="og:url" content="https://ltwza.github.io/road-defender/">
<meta property="og:image" content="https://ltwza.github.io/road-defender/dev/shots/cover.png">
<meta property="og:image:width" content="480">
<meta property="og:image:height" content="900">
<meta property="og:image:alt" content="御剑封路游戏画面">
<meta name="twitter:card" content="summary_large_image">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 可视高度变量 —— 移动端最容易踩的一个坑，单独说明：
     移动浏览器的 100vh 指"大视口"（地址栏收起时的高度），**比真实可视区高**，
     iPhone 竖屏实测差 100~140px。而 #app 是按它撑高的，于是整个 HUD 底部
     被锚到了屏幕外面：血条和属性面板下半截被浏览器 UI 盖住。
     更迷惑的是属性面板此时并**没有**溢出（max-height 也是按大视口算的），
     所以怎么拉都拉不动 —— 看着就像"面板坏了"，其实是整块被裁。
     桌面浏览器没有地址栏，100vh == 可视高度，所以这个问题只在手机上出现。
     dvh 跟随实际可视区；老内核（微信旧 X5）不支持 dvh 时，
     再由 game.js 的 syncViewportHeight() 用 visualViewport 实测覆盖，双保险。 */
  :root{--vh-full:100vh}
  @supports (height:100dvh){:root{--vh-full:100dvh}}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:#e8eaf0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none}
  #app{position:relative;width:100vw;height:var(--vh-full);overflow:hidden}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:grab}
  #game:active{cursor:grabbing}

  /* ---------- 通用 ---------- */
  .hidden{display:none!important}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;z-index:20;
    background:radial-gradient(120% 90% at 50% 20%,#161b26 0%,#0b0d12 70%)}
  .title{font-size:40px;font-weight:500;letter-spacing:6px;
    color:#eaf6ff;text-shadow:0 0 24px rgba(110,180,255,.45)}
  .subtitle{font-size:13px;color:#7c879b;letter-spacing:2px}
  .btn{min-width:190px;padding:13px 26px;border:1px solid rgba(255,255,255,.14);
    border-radius:12px;background:rgba(255,255,255,.05);color:#e8eaf0;
    font-size:15px;font-family:inherit;cursor:pointer;transition:.16s}
  .btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26)}
  .btn:active{transform:scale(.975)}
  .btn.primary{background:linear-gradient(180deg,#3d7dff,#2f63d8);border-color:#5b93ff;
    color:#fff;font-weight:500;box-shadow:0 6px 20px rgba(61,125,255,.3)}
  .btn.primary:hover{background:linear-gradient(180deg,#4d8bff,#376fe4)}
  .btn.ghost{background:rgba(255,255,255,.04)}
  .btn.danger{background:rgba(255,90,90,.13);border-color:rgba(255,110,110,.4);color:#ffb3b3}
  .btn.danger:hover{background:rgba(255,90,90,.2)}
  .muted{font-size:12px;color:#6c7789;line-height:1.9;text-align:center}

  /* ---------- 加载 ---------- */
  #loading{gap:26px}
  .loader-bar{width:230px;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .loader-fill{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#4d8bff,#5eead4);transition:width .25s}
  .loader-text{font-size:12px;color:#7c879b;letter-spacing:1px}

  /* ---------- 主页 ---------- */
  #home .badge-row{display:flex;gap:10px;margin-top:-4px}
  #home .badge{font-size:11.5px;color:#8ea0bb;border:1px solid rgba(255,255,255,.1);
    border-radius:99px;padding:5px 12px;background:rgba(255,255,255,.03)}
  .home-btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .best{font-size:12.5px;color:#6c7789;margin-top:4px}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;z-index:10;pointer-events:none;
    /* 底部额外让出 iPhone 的 Home 条（safe-area）。少了这句，全面屏手机上
       卡片会贴着最下面那条横线，跟它抢位置。两者都要：vw 那一层是"被浏览器 UI 遮挡"，
       这一层是"被系统手势条遮挡"。 */
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column}
  #hud button{pointer-events:auto}
  .hud-top{display:flex;align-items:flex-start;gap:14px}
  .time-wrap{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding-top:2px}
  .time-text{font-size:17px;font-weight:500;color:#dbe6f7;letter-spacing:1px;
    text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .time-bar{width:min(320px,42vw);height:6px;border-radius:99px;background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.12);overflow:hidden}
  .time-fill{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#4d8bff,#5eead4)}
  .score-wrap{text-align:right;min-width:88px}
  .score-label{font-size:10.5px;color:#8ea0bb;letter-spacing:2px}
  .score-text{font-size:22px;font-weight:500;color:#ffe08a;
    text-shadow:0 2px 10px rgba(255,200,80,.35)}
  .icon-btn{width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.14);background:rgba(12,16,24,.72);
    color:#c9d6ea;cursor:pointer;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);transition:.16s}
  .icon-btn:hover{background:rgba(40,50,70,.85);border-color:rgba(255,255,255,.3)}
  .hud-spacer{flex:1}

  /* ---- 底部信息条：词条图标行 + 血条；展开时属性面板长在血条下方 ----
     整条是"一张卡片"，所以它只会向上长，血条不会被挤出屏幕。 */
  .hud-bottom{display:flex;flex-direction:column;align-items:center}
  .stat-strip{width:min(348px,90vw);pointer-events:auto;cursor:pointer;
    border-radius:15px;padding:10px 12px 11px;
    border:1px solid rgba(255,255,255,.13);background:rgba(10,14,21,.62);
    backdrop-filter:blur(8px);transition:border-color .16s}
  .stat-strip:hover{border-color:rgba(255,255,255,.3)}
  .strip-head{display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:7px;font-size:10.5px;white-space:nowrap}
  .strip-head em{font-style:normal;color:#a8bcd8}
  .strip-head i{font-style:normal;color:#7c879b;letter-spacing:.5px}
  /* 图标行：宽度与血条严格一致（都等于卡片的整幅内宽）。
     溢出时用 wrap-reverse —— 从左往右铺，铺满一排就往上换一行。 */
  .ico-row{display:flex;flex-wrap:wrap-reverse;gap:9px;margin-bottom:8px}
  .buff-ico{width:31px;height:31px;border-radius:10px;position:relative;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);transition:.18s}
  .buff-ico svg{width:17px;height:17px;display:block;overflow:visible}
  .buff-ico.off{opacity:.22;filter:grayscale(1)}
  /* 角标允许写 5 个字符（"+0.50" / "+45%"），所以让它往右上角溢出一点 ——
     9px 的槽间距正好容得下，不会压到隔壁那一格。 */
  .buff-ico .lv{position:absolute;top:-6px;right:-7px;padding:0 3.5px;
    height:15px;border-radius:8px;font-size:8.5px;line-height:15px;font-weight:600;
    font-style:normal;letter-spacing:-.3px;white-space:nowrap;
    color:#0a0e14;background:#cfe0f5;box-shadow:0 1px 5px rgba(0,0,0,.65)}
  .hp-bar{height:15px;border-radius:8px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.14);overflow:hidden;position:relative}
  .hp-fill{height:100%;width:100%;border-radius:7px;
    background:linear-gradient(90deg,#ff5d6e,#ff8a5c);transition:width .18s}
  .hp-text{position:absolute;inset:0;font-size:11px;line-height:15px;
    text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);letter-spacing:.5px}

  /* ---- 属性面板：两列摆放是为了压高度（面板长在底部，越高越容易顶到人物）。
     展开时游戏会暂停，所以不必为了"不挡视线"牺牲可读性，高度够放下全部行即可。
     单独加深一层底色：卡片整体是半透明的，正文压到亮色妖物上会发灰读不清。 */
  .stat-panel{margin:9px -12px -11px;padding:9px 12px 11px;
    border-top:1px solid rgba(255,255,255,.09);
    background:rgba(6,9,14,.58);border-radius:0 0 14px 14px;
    max-height:calc(var(--vh-full) * .36);
    overflow-y:auto;display:flex;flex-direction:column;gap:7px}
  .stat-panel.hidden{display:none}
  .stat-panel::-webkit-scrollbar{width:3px}
  .stat-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:99px}
  .sp-head{display:flex;align-items:center;justify-content:space-between;
    font-size:9.5px;color:#7c879b;letter-spacing:2px}
  .sp-x{cursor:pointer;font-size:10px;letter-spacing:.5px;color:#a8bcd8;
    padding:2px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.04)}
  .sp-x:hover{background:rgba(255,255,255,.1)}
  .sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
  .sp-h,.sp-sep,.sp-note{grid-column:1/-1}
  .sp-h{font-size:9.5px;color:#7c879b;letter-spacing:2px;margin-top:1px}
  .sp-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    font-size:11px;color:#cfe0f5;line-height:1.65}
  .sp-r b{font-weight:500;color:#ffe08a;font-variant-numeric:tabular-nums}
  .sp-sep{height:1px;background:rgba(255,255,255,.08);margin:3px 0}
  .sp-note{font-size:10px;color:#6c7789;line-height:1.5}

  /* ---------- 设置弹层 ---------- */
  .modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;
    justify-content:center;background:rgba(5,7,11,.72);backdrop-filter:blur(5px)}
  .panel{width:min(400px,88vw);border-radius:18px;padding:22px 22px 18px;
    background:linear-gradient(180deg,#191f2b,#12161f);
    border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .panel h2{margin:0 0 18px;font-size:17px;font-weight:500;letter-spacing:2px;color:#eaf2ff}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;
    border-top:1px solid rgba(255,255,255,.06)}
  .row label{font-size:13.5px;color:#b8c4d8;width:78px;flex:0 0 auto}
  .row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:99px;
    background:rgba(255,255,255,.14);outline:none}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
    width:15px;height:15px;border-radius:50%;background:#5b93ff;cursor:pointer;
    box-shadow:0 0 10px rgba(91,147,255,.65)}
  .row .val{font-size:12px;color:#8ea0bb;width:44px;text-align:right;flex:0 0 auto}
  .toggle{width:50px;height:27px;border-radius:99px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.08);position:relative;cursor:pointer;transition:.18s;flex:0 0 auto}
  .toggle span{position:absolute;top:2.5px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#8d97a8;transition:.18s}
  .toggle.on{background:rgba(91,147,255,.35);border-color:#5b93ff}
  .toggle.on span{left:26px;background:#8ab4ff}
  .panel-actions{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .panel-actions .btn{min-width:0;width:100%;padding:11px 0;font-size:14px}

  /* ---------- 结算 ---------- */
  #result .res-title{font-size:36px;font-weight:500;letter-spacing:8px}
  .res-stats{display:flex;gap:0;border:1px solid rgba(255,255,255,.1);
    border-radius:14px;overflow:hidden;background:rgba(255,255,255,.03)}
  .res-stat{padding:15px 26px;text-align:center;border-right:1px solid rgba(255,255,255,.08)}
  .res-stat:last-child{border-right:none}
  .res-stat .k{font-size:11px;color:#8ea0bb;letter-spacing:1.5px;margin-bottom:6px}
  .res-stat .v{font-size:23px;font-weight:500;color:#eaf2ff}
  .res-stat .v.gold{color:#ffe08a}
  .res-btns{display:flex;gap:12px;margin-top:6px}
  .res-btns .btn{min-width:150px}

  /* ---------- 提示 ---------- */
  #toast{position:absolute;left:50%;top:19%;transform:translate(-50%,0);z-index:40;
    font-size:15px;color:#eaf2ff;background:rgba(10,14,22,.82);padding:9px 20px;
    border-radius:11px;border:1px solid rgba(255,255,255,.14);pointer-events:none;
    opacity:0;transition:opacity .25s, transform .25s;backdrop-filter:blur(6px)}
  #toast.show{opacity:1;transform:translate(-50%,-8px)}

  /* ---------- 金币 ---------- */
  /* 金币是**跨局持久**的货币，和"这一局打得怎么样"（积分）不是一回事，
     所以它在视觉上是独立的一小块：金色、带icon、每次进账弹一下。
     位置选择：主页放顶部（用户要求）、局内放积分下面一行（不额外占宽度，
     窄屏手机上顶部那一行已经排满了：时间 + 积分 + 设置按钮）。 */
  .coin-pill{display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:99px;font-size:13px;font-weight:500;
    color:#ffdf8f;background:rgba(58,44,12,.55);
    border:1px solid rgba(255,206,110,.32);backdrop-filter:blur(6px)}
  .coin-pill svg{width:15px;height:15px;display:block;flex:0 0 auto}
  .coin-pill b{font-weight:600;font-variant-numeric:tabular-nums;
    font-size:14px;color:#ffe9ad}
  .coin-pill .rc-bal{font-size:11.5px;font-weight:400;color:#9fb0c8;
    padding-left:2px;border-left:1px solid rgba(255,206,110,.25);margin-left:3px}
  .coin-line{display:inline-flex;align-items:center;gap:4px;margin-top:5px;
    font-size:12.5px;font-weight:500;color:#ffdf8f;
    font-variant-numeric:tabular-nums}
  .coin-line svg{width:12px;height:12px;display:block}
  /* 进账时"跳一下"。重新触发动画要先移除类、强制回流、再加回来 ——
     只加类的话第二次进账不会动（用户感知就是"有时候不跳"）。 */
  .coin-line.pop{animation:coinpop .34s ease-out}
  @keyframes coinpop{
    0%{transform:scale(1);color:#fff6d8;text-shadow:0 0 12px rgba(255,210,110,.95)}
    45%{transform:scale(1.22);color:#fff6d8;text-shadow:0 0 12px rgba(255,210,110,.95)}
    100%{transform:scale(1)}
  }
  #home .home-top{position:absolute;top:0;left:0;right:0;display:flex;
    justify-content:flex-end;padding:16px 16px 0;z-index:2}

  /* ---------- 商城 ---------- */
  #shop{padding:0;gap:0;justify-content:flex-start;
    background:radial-gradient(120% 70% at 50% 0%,#1a2130 0%,#0b0d12 62%)}
  .shop-top{width:100%;display:flex;align-items:center;gap:12px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
  .shop-top .back{width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.14);background:rgba(12,16,24,.72);
    color:#c9d6ea;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:17px;line-height:1;font-family:inherit}
  .shop-top .back:hover{background:rgba(40,50,70,.85)}
  .shop-top h2{flex:1;margin:0;font-size:16px;font-weight:500;letter-spacing:4px;color:#eaf2ff}
  .shop-tabs{width:100%;display:flex;gap:8px;padding:2px 16px 10px}
  .shop-tabs .tab{flex:1;padding:9px 0;border-radius:10px;font-size:13px;
    font-family:inherit;cursor:pointer;transition:.16s;color:#9fb0c8;
    border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035)}
  .shop-tabs .tab:hover{background:rgba(255,255,255,.08)}
  .shop-tabs .tab.on{color:#eaf2ff;border-color:rgba(91,147,255,.65);
    background:linear-gradient(180deg,rgba(61,125,255,.30),rgba(47,99,216,.20))}
  /* 性别切换放在皮肤页顶部 —— 它改的是"当前皮肤穿男款还是女款"，
     属于皮肤的外观参数，就该长在它旁边：切一下立绘立刻跟着变。
     放设置里的话，离皮肤太远、又没有立绘可看，切完不知道变了什么。 */
  .gender-row{width:100%;display:flex;align-items:center;gap:12px;
    padding:0 16px 12px}
  .gender-row .gl{font-size:12.5px;color:#8ea0bb;flex:0 0 auto}
  .gender-row .seg{display:flex;flex:1;border-radius:10px;overflow:hidden;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
  .gender-row .seg button{flex:1;padding:8px 0;font-size:12.5px;font-family:inherit;
    cursor:pointer;transition:.16s;color:#9fb0c8;border:0;background:transparent}
  .gender-row .seg button.on{color:#0a0e14;background:#cfe0f5;font-weight:600}
  .gender-row .hint{font-size:11px;color:#6c7789;flex:0 0 auto}
  /* ⚠ 这两行不是装饰，是修一个真实缺陷：网格给了确定高度（flex:1），
   *   隐式行默认按 stretch 分配，卡片会被压成比内容矮（实测 135px），
   *   而 .card{overflow:hidden} 于是把缩略图下半截和整个文字区都裁掉 ——
   *   症状是"商城只有一张张缩略图，名字价格按钮全不见"。
   *   钉成 max-content + 顶部对齐，卡片才会按内容撑开、由 .shop-grid 自己滚。 */
  .shop-grid{width:100%;flex:1;overflow-y:auto;overscroll-behavior:contain;
    display:grid;grid-template-columns:repeat(2,1fr);gap:11px;
    align-content:start;grid-auto-rows:max-content;
    padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .shop-grid::-webkit-scrollbar{width:3px}
  .shop-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:99px}
  .card{border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
    border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035);
    transition:border-color .16s}
  .card.using{border-color:rgba(126,224,180,.55);
    box-shadow:0 0 0 1px rgba(126,224,180,.18) inset}
  /* 缩略图铺满卡片宽度，高度按画布自带的比例（132:168）自动算。
   * 不要在 canvas 上再写内联 width/height —— 那会和这条规则打架，
   * 结果画布只有 132px 宽、右边空出一条黑边（width 与 height 属性只管
   * **像素缓冲**多大，CSS 才管显示多大；缓冲按 DPR 放大是为了不发虚）。 */
  .card .thumb{position:relative;background:#0d121b;line-height:0}
  .card .thumb canvas{width:100%;height:auto;display:block}
  .card .tag{position:absolute;top:7px;right:7px;padding:2.5px 7px;border-radius:99px;
    font-size:9.5px;letter-spacing:.5px;backdrop-filter:blur(4px)}
  .card .tag.using{background:rgba(24,66,50,.85);color:#8dffc4;
    border:1px solid rgba(126,224,180,.5)}
  .card .tag.own{background:rgba(30,40,58,.85);color:#a8bcd8;
    border:1px solid rgba(255,255,255,.18)}
  .card .tag.base{background:rgba(44,38,20,.85);color:#e0c98a;
    border:1px solid rgba(220,190,110,.45)}
  .card .cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
  .card .cname{font-size:13.5px;color:#eaf2ff;font-weight:500}
  .card .csub{font-size:10.5px;color:#7c879b;letter-spacing:.5px}
  .card .cdesc{font-size:11px;color:#8ea0bb;line-height:1.55;flex:1}
  .card .cfoot{display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-top:7px;min-height:28px}
  .card .cprice{display:inline-flex;align-items:center;gap:4px;
    font-size:13px;font-weight:600;color:#ffdf8f;font-variant-numeric:tabular-nums}
  .card .cprice svg{width:13px;height:13px}
  .card .cprice.poor{color:#ff9aa8}
  .card .cprice.free{font-size:11.5px;font-weight:400;color:#6c7789}
  .card .cbtn{padding:6px 13px;border-radius:9px;font-size:12px;font-family:inherit;
    cursor:pointer;transition:.16s;color:#e8eaf0;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07)}
  .card .cbtn:hover{background:rgba(255,255,255,.14)}
  .card .cbtn.buy{color:#fff;border-color:#5b93ff;
    background:linear-gradient(180deg,#3d7dff,#2f63d8)}
  .card .cbtn.buy:hover{background:linear-gradient(180deg,#4d8bff,#376fe4)}
  .shop-hint{padding:0 16px;font-size:11px;color:#6c7789;text-align:center}
  #buyConfirm .bc-row{display:flex;align-items:baseline;justify-content:space-between;
    font-size:14px;color:#eaf2ff;padding:4px 0 10px;
    border-bottom:1px solid rgba(255,255,255,.08)}
  #buyConfirm .bc-row b{color:#ffdf8f;font-size:17px}
  #buyConfirm .bc-sub{font-size:11.5px;color:#8ea0bb;line-height:1.7;padding-top:10px}
  #buyConfirm .bc-sub .warn{color:#ff9aa8}
  @media (min-width:620px){
    .shop-grid{grid-template-columns:repeat(3,1fr);max-width:760px;margin:0 auto}
  }

  @media (max-width:560px){
    .title{font-size:31px;letter-spacing:4px}
    /* 小屏上信息条要更宽一点：图标行的宽度就等于血条宽度，
     * 窄了会早换行、把卡片顶高，反而更容易压到人物 */
    .stat-strip{width:min(94vw,420px)}
    .res-stat{padding:12px 16px}
    .res-stat .v{font-size:19px}
    .res-btns .btn{min-width:0;flex:1}
    .res-btns{width:88vw}
    .shop-grid{gap:9px}
    .card .cdesc{font-size:10.5px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ===== 游戏内 HUD ===== -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="time-wrap">
        <div class="time-text" id="timeText">3:00</div>
        <div class="time-bar"><div class="time-fill" id="timeFill"></div></div>
      </div>
      <div class="score-wrap">
        <div class="score-label">积分</div>
        <div class="score-text" id="scoreText">0</div>
        <!-- 局内金币：本局已经挣到多少。放在积分下面一行，不额外占横向空间
             （顶部这一行在 360px 宽的手机上已经排满：时间 + 积分 + 设置）。 -->
        <div class="coin-line" id="coinLine">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/>
            <circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none" opacity=".55"/></svg>
          <span id="coinText">0</span>
        </div>
      </div>
      <button class="icon-btn" id="btnSettingsInGame" title="设置" aria-label="设置">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <div class="hud-spacer"></div>

    <!-- 底部信息条：词条图标行 + 血条。整条可点，展开/收起属性面板。
         拖动会在这里被"交棒"给游戏（见 game.js 的 bindStatsStrip），
         所以拇指压在它上面也能正常移动人物。 -->
    <div class="hud-bottom">
      <div class="stat-strip" id="statStrip">
        <div class="strip-head"><em id="weaponName">飞剑</em><i id="statsArrow">属性 ▾</i></div>
        <div class="ico-row" id="icoRow"></div>
        <div class="hp-bar">
          <div class="hp-fill" id="hpFill"></div>
          <div class="hp-text" id="hpText">100 / 100</div>
        </div>
        <div class="stat-panel hidden" id="statPanel"></div>
      </div>
    </div>
  </div>

  <!-- ===== 加载界面 ===== -->
  <div id="loading" class="screen">
    <div class="title" style="font-size:32px;letter-spacing:8px">御剑封路</div>
    <div class="subtitle">ROAD DEFENDER</div>
    <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
    <div class="loader-text" id="loaderText">正在铺设道路…</div>
  </div>

  <!-- ===== 主页 ===== -->
  <div id="home" class="screen hidden">
    <!-- 顶部金币栏：用户要求"主页顶部显示当前金币"。 -->
    <div class="home-top">
      <div class="coin-pill" id="homeCoinPill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/>
          <circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none" opacity=".55"/></svg>
        <b id="homeCoins">0</b>
      </div>
    </div>
    <div class="title">御剑封路</div>
    <div class="subtitle">三路妖物来袭 · 御剑而守</div>
    <div class="badge-row">
      <div class="badge">按住屏幕左右拖动 · 键盘 A / D 或 ← / →</div>
      <div class="badge">坚持 3:00 即获胜</div>
    </div>
    <div class="home-btns">
      <button class="btn primary" id="btnStart">开始游戏</button>
      <button class="btn ghost" id="btnShop">商城</button>
      <button class="btn ghost" id="btnHomeSettings">设置</button>
    </div>
    <div class="best" id="bestScore"></div>
  </div>

  <!-- ===== 商城 ===== -->
  <div id="shop" class="screen hidden">
    <div class="shop-top">
      <button class="back" id="btnShopBack" aria-label="返回主页">←</button>
      <h2>商城</h2>
      <div class="coin-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/>
          <circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none" opacity=".55"/></svg>
        <b id="shopCoins">0</b>
      </div>
    </div>
    <div class="shop-tabs" id="shopTabs">
      <button class="tab on" data-tab="all">全部</button>
      <button class="tab" data-tab="map">地图</button>
      <button class="tab" data-tab="skin">皮肤</button>
    </div>
    <div class="gender-row" id="genderRow">
      <span class="gl">角色性别</span>
      <div class="seg" id="genderSeg">
        <button data-gender="male" class="on">男款</button>
        <button data-gender="female">女款</button>
      </div>
      <span class="hint">只换男女 · 皮肤不变</span>
    </div>
    <div class="shop-grid" id="shopGrid"></div>
    <div class="shop-hint" id="shopHint"></div>
  </div>

  <!-- ===== 购买确认 ===== -->
  <div id="buyConfirm" class="modal hidden">
    <div class="panel">
      <h2>购买确认</h2>
      <div class="bc-row"><span id="bcName">—</span><b id="bcPrice">0</b></div>
      <div class="bc-sub" id="bcSub"></div>
      <div class="panel-actions">
        <button class="btn primary" id="bcOk">确认购买</button>
        <button class="btn ghost" id="bcCancel">取消</button>
      </div>
    </div>
  </div>

  <!-- ===== 设置 ===== -->
  <div id="settings" class="modal hidden">
    <div class="panel">
      <h2>设置</h2>
      <div class="row" style="border-top:none">
        <label>音量</label>
        <input type="range" id="volRange" min="0" max="100" value="60">
        <span class="val" id="volVal">60%</span>
      </div>
      <div class="row">
        <label>震动反馈</label>
        <button class="toggle on" id="vibToggle" aria-label="震动反馈"><span></span></button>
      </div>
      <div class="panel-actions">
        <button class="btn ghost ingame-only" id="btnResume">继续游戏</button>
        <button class="btn ghost ingame-only" id="btnRestart">重新开始</button>
        <button class="btn danger ingame-only" id="btnBackHome">返回主页</button>
        <button class="btn primary home-only" id="btnCloseSetHome">关闭</button>
      </div>
    </div>
  </div>

  <!-- ===== 结算 ===== -->
  <div id="result" class="screen hidden">
    <div class="res-title" id="resTitle">通关</div>
    <div class="subtitle" id="resSub">妖物退散</div>
    <div class="res-stats">
      <div class="res-stat"><div class="k">积分</div><div class="v gold" id="resScore">0</div></div>
      <div class="res-stat"><div class="k">击杀</div><div class="v" id="resKills">0</div></div>
      <div class="res-stat"><div class="k">存活</div><div class="v" id="resTime">0:00</div></div>
    </div>
    <!-- 本局金币与余额：金币是唯一跨局带走的东西，必须在这里说清楚
         "这局挣了多少 / 现在一共多少"，否则商城里那个数字像是凭空来的。 -->
    <div class="coin-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/>
        <circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none" opacity=".55"/></svg>
      <b id="resCoinGain">+0</b>
      <span class="rc-bal" id="resCoinBal">余额 0</span>
    </div>
    <div class="res-btns">
      <button class="btn primary" id="btnAgain">再来一局</button>
      <button class="btn ghost" id="btnResHome">返回主页</button>
    </div>
    <div class="best" id="resBest"></div>
  </div>

  <div id="toast"></div>
</div>

<script src="projector.js"></script>
<script src="game.js"></script>
</body>
</html>
